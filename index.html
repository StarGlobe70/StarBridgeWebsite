<!doctype html>
<html lang="en">

<head>
    <!-- META -->
    <meta charset="utf-8">
    <meta name="robots" content="noodp">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- PAGE TITLE -->
    <title>Starbridge - Coming Soon</title>

    <!-- FAVICON -->
    <link rel="shortcut icon" href="assets/img/Starbridge Global.PNG">

    <!-- FONTS -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700&subset=latin-ext" rel="stylesheet">

    <!-- STYLESHEETS -->
    <link rel="stylesheet" type="text/css" href="assets/css/plugins.css">
    <link rel="stylesheet" type="text/css" href="assets/css/main.css">

    <!-- CSS Fix for Visibility -->
    <style>
        .open-popup {
            display: block;
            visibility: visible;
            z-index: 9999;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="spinner"></div>
    </div>

    <!-- HERO SECTION -->
    <div class="hero">
        <img src="assets/img/background.jpeg" class="background-image" alt="Background Image">

        <div class="front-content">
            <div class="container-mid">

                <!-- Title Animation -->
                <div class="animation-container animation-fade-right" data-animation-delay="300" style="background-color: #000; padding: 20px; border-radius: 20;">
                    <h1>Starbridge Global</h1>
                </div>

                <!-- Contact Button -->
                <div class="animation-container animation-fade-up" data-animation-delay="900">
                    <div class="open-popup">Contact</div>
                </div>

            </div>

            <!-- Footer -->
            <div class="footer">
                <div class="animation-container animation-fade-up" data-animation-delay="1200">
                    <p>© 2024 Starbridge | Design by StarbridgeGlobal</p>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP FORM -->
    <div class="popup" style="display: none;">
        <div class="card">
            <div class="close-popup close-button"></div>
            <i class="fa fa-envelope-o" aria-hidden="true"></i>
            <h3>Sign Up</h3>
            <p class="subline">Contact Us</p>

            <form action="assets/php/subscribe.php" method="post" class="subscribe-form">
                <input type="text" name="email" placeholder="* Enter your Email" class="email form-control">
                <div class="fhp-input">
                    <input type="text" name="phone" placeholder="* Enter your phone" class="email form-control">
                </div>
                <button type="submit" class="btn btn-primary form-control">
                    Contact <i class="fa fa-long-arrow-right" aria-hidden="true"></i>
                </button>
                <div class="error-message">* Enter a valid Email Address!</div>
                <div class="success-message">* Successfully Contacted!</div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPTS -->
    <script type="text/javascript" src="assets/js/plugins.js"></script>
    <script type="text/javascript" src="assets/js/main.js"></script>

    <!-- Popup Script -->
    <script>
        document.querySelector('.open-popup').addEventListener('click', function () {
            document.querySelector('.popup').style.display = 'block';
        });

        document.querySelector('.close-popup').addEventListener('click', function () {
            document.querySelector('.popup').style.display = 'none';
        });
    </script>

</body>

</html>
